<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--green:#55D8CB;--ink:#222222;--mint:#E7F9F6;--teal:#2BA89A;--screen:#FAFAFA;--orange:#EE7E38}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:Rubik,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.layer{position:absolute;inset:0;overflow:hidden;visibility:hidden}
#S1{background:var(--orange)} #S2{background:var(--ink)} #S3{background:var(--screen)} #S4{background:var(--green)} #S5{background:var(--mint)}
#S3 img.clip{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 60%}
.logo{position:absolute;left:64px;top:150px;width:150px;height:150px;z-index:9}
.w{position:absolute;right:72px;font-weight:900;line-height:1;white-space:nowrap;text-align:right;transform-origin:100% 50%}
.c{position:absolute;left:0;right:0;text-align:center;font-weight:900;line-height:1;white-space:nowrap;transform-origin:50% 50%}
.car{position:absolute;top:1210px;width:190px;height:120px}
.ground{position:absolute;left:0;right:0;top:1326px;height:6px;background:var(--ink)}
.clock{position:absolute;left:415px;top:890px;width:250px;height:250px}
.endwrap{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center}
.pill{background:var(--green);color:var(--ink);font-weight:800;font-size:72px;border-radius:999px;padding:32px 90px;line-height:1;white-space:nowrap}
.badges{display:flex;direction:ltr;gap:26px;align-items:center}
.badges img{height:104px;width:auto;display:block}
.legal{font-weight:400;font-size:30px;opacity:.8;white-space:nowrap}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:20;pointer-events:none}
</style>
</head>
<body>
<div class="layer" id="S1">
  <div class="w" id="s1a" style="top:360px;font-size:230px">הרכב</div>
  <div class="w" id="s1b" style="top:590px;font-size:230px">בתור</div>
  <svg class="clock" id="clock" viewBox="0 0 300 300">
    <circle cx="150" cy="150" r="130" fill="#FAFAFA" stroke="#222" stroke-width="12"/>
    <line id="hHand" x1="150" y1="150" x2="150" y2="95" stroke="#222" stroke-width="14" stroke-linecap="round"/>
    <line id="mHand" x1="150" y1="150" x2="150" y2="60" stroke="#EE7E38" stroke-width="10" stroke-linecap="round"/>
    <circle cx="150" cy="150" r="12" fill="#222"/>
  </svg>
  <div class="ground"></div><div id="cars"></div>
</div>
<div class="layer" id="S2"><div class="c" id="s2a" style="top:780px;font-size:280px;color:#FFFFFF">ואתם?</div></div>
<div class="layer" id="S3">
  <img class="clip" id="clip" alt="">
  <div class="w" id="s3a" style="top:300px;font-size:300px">בים</div>
  <div class="w" id="s3b" style="top:280px;font-size:150px">היום שלכם</div>
  <div class="w" id="s3c" style="top:450px;font-size:150px">הטסט שלנו</div>
</div>
<div class="layer" id="S4">
  <div class="c" id="s4a" style="top:520px;font-size:230px">הטסט?</div>
  <div class="c" id="s4b" style="top:780px;font-size:230px">כבר עבר</div>
  <svg id="check" viewBox="0 0 400 300" style="position:absolute;left:340px;top:1080px;width:400px;height:300px">
    <path id="checkp" d="M40 160 L150 260 L360 40" fill="none" stroke="#222" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div>
<div class="layer" id="S5">
  <div class="endwrap" style="top:300px"><img id="e_logo" src="logo.png" style="width:320px;height:320px" alt=""></div>
  <div class="endwrap" style="top:700px"><div id="e_sub" style="font-weight:800;font-size:84px">אתם בבית. הרכב עובר</div></div>
  <div class="endwrap" style="top:920px"><div class="pill" id="e_pill">הורידו את עבר</div></div>
  <div class="endwrap" style="top:1120px"><div class="badges" id="e_badges"><img src="badge-googleplay.png" alt=""><img src="badge-appstore.png" alt=""></div></div>
  <div class="endwrap" style="top:1290px"><div class="legal" id="e_legal">*השירות זמין ברחובות והסביבה בלבד. בכפוף לתנאי השירות.</div></div>
</div>
<img class="logo" id="logo" src="logo.png" alt="">
<div id="flash"></div>
<script>
const CAR = `<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
<path d="M14 92 L14 70 Q14 60 26 58 L44 56 L62 26 Q66 20 74 20 L124 20 Q132 20 137 26 L160 54 L184 60 Q194 63 194 74 L194 92 Z" fill="#FAFAFA" stroke="#222" stroke-width="8" stroke-linejoin="round"/>
<path d="M58 54 L72 30 L98 30 L98 54 Z M106 30 L126 30 Q130 30 133 34 L148 54 L106 54 Z" fill="#EE7E38" stroke="#222" stroke-width="6" stroke-linejoin="round"/>
<circle cx="56" cy="94" r="17" fill="#FAFAFA" stroke="#222" stroke-width="8"/><circle cx="156" cy="94" r="17" fill="#FAFAFA" stroke="#222" stroke-width="8"/>
<rect x="182" y="66" width="10" height="8" rx="3" fill="#222"/></svg>`;
const N=6, cars=[]; for(let i=0;i<N;i++){const d=document.createElement('div');d.className='car';d.innerHTML=CAR;document.getElementById('cars').appendChild(d);cars.push(d);}
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), prog=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), back=x=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const BPM=128, B=60/BPM;
// shot boundaries (seconds), all on the beat grid
const S=[0, 4*B, 6*B, 14*B, 18*B, 99]; // S1 0-1.875 | S2 -2.81 | S3 -6.56 | S4 -8.44 | S5 -end
window.SHOTS=S;
function slam(el,t,a,d=0.28){ // big type punches in: scale 1.7 -> 1 with overshoot, fades in fast
  if(t<a){el.style.opacity=0;return;}
  const p=prog(t,a,a+d); el.style.opacity=clamp(p*4);
  const s=1.7-0.7*back(p); const sh=(1-p)*14*Math.sin(t*90); el.style.transform=`translate(${sh}px,0) scale(${s})`;
}
function out(el,t,a,d=0.18){ if(t<a)return; const p=eo(prog(t,a,a+d)); el.style.opacity=1-p; el.style.transform=`translateY(${-160*p}px)`; }
function pop(el,t,a,d=0.35){ if(t<a){el.style.opacity=0;return;} const p=prog(t,a,a+d); el.style.opacity=clamp(p*3); el.style.transform=`scale(${0.5+0.5*back(p)})`; }
window.CLIP_FPS=30; window.CLIP_FRAMES=0;

window.applySpec=function(sp){
  const set=(id,v)=>{ if(v!==undefined && v!==null) $(id).textContent=v; };
  set('s1a',sp.pain[0]); set('s1b',sp.pain[1]); set('s2a',sp.turn); set('s3a',sp.answer);
  set('s3b',sp.lines[0]); set('s3c',sp.lines[1]); set('s4a',sp.verdict[0]); set('s4b',sp.verdict[1]); set('e_sub',sp.end);
  const fit=(id,max)=>{ const el=$(id); let f=parseFloat(el.style.fontSize)||parseFloat(getComputedStyle(el).fontSize); el.style.transform='none';
    while(el.scrollWidth>max && f>60){ f-=4; el.style.fontSize=f+'px'; } };
  ['s1a','s1b','s3a','s3b','s3c'].forEach(id=>fit(id,936)); ['s2a','s4a','s4b'].forEach(id=>fit(id,980)); fit('e_sub',980);
};
window.seek=async function(t){
  const shot=S.findIndex((s,i)=>t>=s && t<S[i+1]);
  ['S1','S2','S3','S4','S5'].forEach((id,i)=>$(id).style.visibility = i===shot?'visible':'hidden');
  // white flash on every cut
  const lastCut=S.filter(s=>s<=t&&s>0).pop(); $('flash').style.opacity = lastCut!==undefined ? 0.55*clamp(1-(t-lastCut)/0.12) : 0;
  // S1: queue + clock
  slam($('s1a'),t,0.02); slam($('s1b'),t,B);
  pop($('clock'),t,B*1.5,0.3);
  const ang=t*1400; $('mHand').setAttribute('transform',`rotate(${ang} 150 150)`); $('hHand').setAttribute('transform',`rotate(${ang/12} 150 150)`);
  cars.forEach((c,i)=>{ const target=-120+i*200; const p=eo(prog(t,0.15+i*0.05,0.55+i*0.05)); // zip in from the left, then stuck
    c.style.left=(target-1300*(1-p))+'px'; const jit = t>0.8 ? Math.sin(t*40+i)*2 : 0; c.style.transform=`translateY(${jit}px)`; });
  // S2: "ואתם?" slowly pushing in
  slam($('s2a'),t,S[1]+0.02,0.25); if(t>S[1]+0.25){ const p=prog(t,S[1]+0.25,S[2]); $('s2a').style.transform=`scale(${1+0.12*p})`; }
  // S3: the day back
  const ct=Math.max(0,t-S[2]); const fi=Math.min(window.CLIP_FRAMES-1,Math.floor(ct*window.CLIP_FPS));
  if(shot===2){ const src='clipframes/'+String(fi+1).padStart(4,'0')+'.png'; const img=$('clip'); if(img.getAttribute('src')!==src){img.src=src; await img.decode().catch(()=>{});}
    img.style.transform=`scale(${1.12-0.12*eo(prog(t,S[2],S[2]+0.6))})`; }
  slam($('s3a'),t,S[2]+0.02,0.3); out($('s3a'),t,S[2]+5*B);
  slam($('s3b'),t,S[2]+5*B+0.04); slam($('s3c'),t,S[2]+6*B);
  // S4: verdict
  slam($('s4a'),t,S[3]+0.02); slam($('s4b'),t,S[3]+B);
  const cp=$('checkp'); const L=420; cp.style.strokeDasharray=L; cp.style.strokeDashoffset = L*(1-eo(prog(t,S[3]+2*B,S[3]+3*B)));
  // S5: end card
  pop($('e_logo'),t,S[4]+0.02); pop($('e_sub'),t,S[4]+B,0.3); pop($('e_pill'),t,S[4]+2*B,0.35);
  pop($('e_badges'),t,S[4]+3*B,0.3); pop($('e_legal'),t,S[4]+3*B,0.3);
  if(t>S[4]+2*B+0.4){ const k=1+0.05*Math.max(0,Math.cos(((t-S[4])/B)*Math.PI*2)); $('e_pill').style.transform=`scale(${k})`; } // pulse on the beat
  $('logo').style.visibility = (shot===4||shot===3) ? 'hidden':'visible';
  return true;
};
</script>
</body>
</html>
